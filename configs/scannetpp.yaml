# ScanNet++ DSLR, nvs_sem_val split. The benchmark OpenSplat3D reports 3D
# instance segmentation on: 50 room-scale indoor scans, scored against points
# sampled from the aligned mesh rather than against rendered 2D masks.

# Model Parameters
sh_degree: 3
init_points: 131_072
final_points: 2_097_152
activation_scale: 1
device: cuda

# Pipeline Parameters
iterations: 20_000
densify_from: 2_000
densify_until: 11_000
densify_factor: 1.15
white_background: false
quantile_weight: 1e-4
viewer: false
debug: false
checkpoint_every: 2_000

# Optimization Parameters
points_lr_init: 2e-4
points_lr_final: 5e-6
density_lr_init: 1e-1
density_lr_final: 1e-2
attributes_lr_init: 5e-3
attributes_lr_final: 5e-4
sh_factor: 0.1
freeze_points: 18_000

# Dataset Parameters
dataset: "scannetpp"
data_path: "data/scannetpp"
scene: "7b6477cb95"
patch_based: false
# The release ships a single 1752x1168 resolution; the loader resizes on load,
# so this is a working size rather than an index into a pyramid on disk.
downsample: [2]
downsample_iterations: [0]
