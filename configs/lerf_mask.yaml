# LERF-Mask (Gaussian Grouping's annotated LERF scenes) -- figurines, ramen,
# teatime. Used to rank instance segmentation against the published baselines,
# so the split is the benchmark's own: images_train/ trains, images/test_*.jpg
# is graded against test_mask/ and never seen.

# Model Parameters
sh_degree: 3
init_points: 131_072
final_points: 2_097_152
activation_scale: 1
device: cuda

# Pipeline Parameters
iterations: 20_000
densify_from: 2_000
densify_until: 11_000
densify_factor: 1.15
white_background: true
quantile_weight: 1e-4
viewer: false
debug: false

# Optimization Parameters
points_lr_init: 2e-4
points_lr_final: 5e-6
density_lr_init: 1e-1
density_lr_final: 1e-2
attributes_lr_init: 5e-3
attributes_lr_final: 5e-4
sh_factor: 0.1
freeze_points: 18_000

# Dataset Parameters
dataset: "colmap"
data_path: "data/lerf_mask"
scene: "figurines"
patch_based: false
# The images ship at ~986x728, which is already close to mip-NeRF 360's
# downsample-2 working size, so there is nothing to downsample and no schedule.
downsample: [1]
downsample_iterations: [0]
